name: Rescan release with VirusTotal
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to scan
        required: true
        type: string
  repository_dispatch:
    types: [virustotal_scan_release]
permissions:
  contents: write
jobs:
  scan:
    uses: ./.github/workflows/virustotal-release.yml
    with:
      release_tag: ${{ inputs.tag || github.event.client_payload.tag }}
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
