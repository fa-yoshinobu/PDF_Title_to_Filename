name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"
      - "Ver.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  release:
    outputs:
      release_tag: ${{ steps.publish_release.outputs.release_tag }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: PDF_Title_to_Filename/PDF_Title_to_Filename.csproj

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          $patterns = @(
            '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$',
            '^V(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$',
            '^V\.(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$',
            '^Ver\.(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$'
          )

          $version = $null
          foreach ($pattern in $patterns) {
            if ($tag -match $pattern) {
              $version = $Matches.version
              break
            }
          }

          if (-not $version) {
            throw "Tag must look like v1.2.3, V1.2.3, V.1.2.3, or Ver.1.2.3."
          }

          [xml]$project = Get-Content "PDF_Title_to_Filename\PDF_Title_to_Filename.csproj"
          $projectVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($projectVersion -ne $version) {
            throw "Tag version '$version' does not match project version '$projectVersion'."
          }

          $fileVersion = (($version -replace '-.*$', '') + ".0")

          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "FILE_VERSION=$fileVersion" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore PDF_Title_to_Filename.sln

      - name: Publish single-file executable
        run: >
          dotnet publish PDF_Title_to_Filename\PDF_Title_to_Filename.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.APP_VERSION }}
          -p:AssemblyVersion=${{ env.FILE_VERSION }}
          -p:FileVersion=${{ env.FILE_VERSION }}
          -p:InformationalVersion=${{ env.APP_VERSION }}
          --no-restore
          -o artifacts\publish

      - name: Set up release tools
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Prepare ZIP checksum and English release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python .github/scripts/release_assets.py prepare --repository "$env:GITHUB_REPOSITORY" --release-tag "$env:RELEASE_TAG" --asset-name PDF_Title_to_Filename-win-x64.zip --file artifacts/publish/PDF_Title_to_Filename.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish ZIP and checksum
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag', '--title', "PDF Title to Filename $env:RELEASE_TAG", '--notes-file', 'artifacts/release/release-notes.md',
            'artifacts/release/PDF_Title_to_Filename-win-x64.zip', 'artifacts/release/PDF_Title_to_Filename-win-x64.zip.sha256')
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  check-published-release:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
